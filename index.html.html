<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CPV — Pink Heart · Veri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --g:  #0F7A5B;
  --g2: #0A5240;
  --g3: #e6f4ef;
  --pk: #D4547A;
  --pk2:#B8365C;
  --pk3:#fce8ef;
  --gd: #C8A96E;
  --gd2:#a8893e;
  --ink:#1a2e25;
  --ink2:#2d4a3e;
  --ink3:#5a7a6e;
  --ink4:#94a89f;
  --line:#d8e8e2;
  --line2:#edf5f1;
  --bg: #f4f8f6;
  --w:  #ffffff;
  --ok: #0F7A5B;
  --ok-bg:#e6f4ef;
  --err:#c0392b;
  --err-bg:#fdecea;
  --warn:#d68910;
  --warn-bg:#fef9e7;
  --r:8px;
  --r2:14px;
  --sh:0 1px 4px rgba(15,122,91,.08),0 1px 2px rgba(0,0,0,.04);
  --sh2:0 4px 20px rgba(15,122,91,.12);
  --fn:'DM Sans',sans-serif;
  --fm:'DM Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fn);background:var(--bg);color:var(--ink);font-size:13px;min-height:100vh}

/* ── TOPBAR ── */
.topbar{position:fixed;top:0;left:0;right:0;height:52px;background:var(--ink);display:flex;align-items:center;padding:0 1.5rem;gap:1rem;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand-logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--pk),var(--gd));display:flex;align-items:center;justify-content:center;font-size:16px}
.brand-name{font-size:14px;font-weight:600;color:#fff;letter-spacing:.02em}
.brand-sub{font-size:10px;color:rgba(255,255,255,.4);letter-spacing:.08em;text-transform:uppercase}
.topbar-nav{display:flex;gap:2px;margin-left:1.5rem;flex:1;overflow-x:auto}
.topbar-nav::-webkit-scrollbar{display:none}
.tnav{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r);border:none;background:none;cursor:pointer;font-family:var(--fn);font-size:12px;color:rgba(255,255,255,.5);white-space:nowrap;transition:all .15s}
.tnav:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.85)}
.tnav.active{background:rgba(15,122,91,.35);color:#fff;font-weight:500}
.tnav i{font-size:14px}
.topbar-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.status-dot{width:7px;height:7px;border-radius:50%;background:#ccc;flex-shrink:0;transition:background .3s}
.status-dot.ok{background:#4ade80}
.status-dot.err{background:#f87171}
.status-txt{font-size:11px;color:rgba(255,255,255,.4)}

/* ── MAIN ── */
.main{margin-top:52px;padding:1.5rem;max-width:1280px}

/* ── CARDS ── */
.card{background:var(--w);border-radius:var(--r2);border:1px solid var(--line);box-shadow:var(--sh);overflow:hidden}
.card-head{padding:.85rem 1.1rem;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,var(--g3) 0%,var(--w) 100%)}
.card-title{font-size:13px;font-weight:600;color:var(--ink);flex:1}
.card-body{padding:1.1rem}

/* ── TABS CONTENT ── */
.tab-content{display:none}
.tab-content.active{display:block}

/* ── METAIS TABLE ── */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{font-size:10px;font-weight:600;color:var(--ink3);text-align:left;padding:7px 10px;border-bottom:1.5px solid var(--line);text-transform:uppercase;letter-spacing:.06em;background:var(--line2)}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--g3)}
.tbl input,.tbl select{width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:6px;font-family:var(--fn);font-size:12px;background:var(--w);color:var(--ink);outline:none;transition:border-color .15s}
.tbl input:focus,.tbl select:focus{border-color:var(--g);box-shadow:0 0 0 2px rgba(15,122,91,.12)}
.color-dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}

/* ── BUTTONS ── */
button{font-family:var(--fn);cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--r);border:none;font-size:12px;font-weight:500;transition:all .15s;white-space:nowrap}
.btn-g{background:var(--g);color:#fff}.btn-g:hover{background:var(--g2)}
.btn-pk{background:var(--pk);color:#fff}.btn-pk:hover{background:var(--pk2)}
.btn-gd{background:var(--gd);color:#fff}.btn-gd:hover{background:var(--gd2)}
.btn-ghost{background:none;border:1px solid var(--line);color:var(--ink3)}.btn-ghost:hover{background:var(--line2)}
.btn-icon{background:none;border:none;color:var(--ink4);padding:4px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:15px}.btn-icon:hover{color:var(--err);background:var(--err-bg)}
.add-link{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--g);background:none;border:none;padding:4px 0;cursor:pointer}.add-link:hover{color:var(--g2)}

/* ── LAYOUT SKU ── */
.sku-layout{display:flex;gap:1rem}
.sku-sidebar{width:168px;flex-shrink:0}
.sku-sidebar-inner{background:var(--w);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.sidebar-head{padding:.7rem .9rem;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.sk-tab{display:flex;align-items:center;gap:7px;width:100%;padding:8px 10px;border:none;background:none;text-align:left;font-family:var(--fn);font-size:12px;color:var(--ink3);cursor:pointer;border-bottom:1px solid var(--line2);transition:all .12s}
.sk-tab:last-child{border-bottom:none}
.sk-tab.active{background:var(--g3);color:var(--g);font-weight:500}
.sk-tab:hover:not(.active){background:var(--line2)}
.sk-tab i{font-size:13px;flex-shrink:0}
.sku-editor{flex:1;min-width:0}

/* ── FIELDS ── */
.fg{margin-bottom:.9rem}
.fg-head{font-size:10px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;padding:5px 0 6px;border-bottom:1.5px solid var(--line);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.fg-head i{font-size:13px;color:var(--g)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.fi label{display:block;font-size:10px;font-weight:500;color:var(--ink3);margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em}
.fi input,.fi select{width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:6px;font-family:var(--fn);font-size:12px;color:var(--ink);background:var(--w);outline:none;transition:border-color .15s}
.fi input:focus,.fi select:focus{border-color:var(--g);box-shadow:0 0 0 2px rgba(15,122,91,.1)}
.calc-box{padding:6px 9px;background:var(--g3);border-radius:6px;font-size:12px;font-weight:600;color:var(--g);border:1px solid var(--line);font-family:var(--fm)}
.vol-hint{font-size:10px;color:var(--g);margin-top:2px}

/* ── SN BUTTONS ── */
.sn-wrap{display:flex;flex-direction:column;gap:3px}
.sn-row{display:flex;align-items:center;gap:5px;margin-top:3px}
.sn-btn{padding:3px 10px;border-radius:20px;border:1px solid var(--line);background:none;cursor:pointer;font-size:11px;font-family:var(--fn);color:var(--ink3);transition:all .12s}
.sn-btn.on-s{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.sn-btn.on-n{background:var(--line2);color:var(--ink3)}
.sn-cost{flex:1;min-width:0}
.sn-cost label{display:block;font-size:9px;color:var(--ink4);margin-bottom:2px}

/* ── MLS GRID ── */
.mls-hdr{display:grid;grid-template-columns:2fr 80px 80px 80px 80px 28px;gap:6px;margin-bottom:4px}
.mls-hdr span{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink4);font-weight:500}
.mls-row{display:grid;grid-template-columns:2fr 80px 80px 80px 80px 28px;gap:6px;align-items:center;margin-bottom:5px}
.mls-row select,.mls-row input{width:100%;padding:5px 7px;border:1px solid var(--line);border-radius:6px;font-family:var(--fn);font-size:11px;color:var(--ink);background:var(--w);outline:none}
.mls-row select:focus,.mls-row input:focus{border-color:var(--g)}

/* ── INDIRETOS TABLE ── */
.ind-tbl{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:6px}
.ind-tbl th{font-size:9px;font-weight:600;color:var(--ink4);text-align:left;padding:5px 7px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.05em}
.ind-tbl td{padding:4px 5px;border-bottom:1px solid var(--line2);vertical-align:middle}
.ind-tbl tr:last-child td{border-bottom:none}
.ind-tbl input,.ind-tbl select{width:100%;padding:4px 7px;border:1px solid var(--line);border-radius:5px;font-family:var(--fn);font-size:11px;color:var(--ink);background:var(--w);outline:none}
.ind-tbl input:focus,.ind-tbl select:focus{border-color:var(--g)}

/* ── SUMMARY ── */
.summary{background:linear-gradient(135deg,var(--ink) 0%,var(--ink2) 100%);border-radius:var(--r2);padding:1.1rem 1.25rem;margin-top:1rem}
.sum-title{font-size:13px;font-weight:600;color:#fff;margin-bottom:.7rem}
.sum-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:7px}
.sum-card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:9px 11px;backdrop-filter:blur(4px)}
.sum-card.hi{background:rgba(15,122,91,.3);border-color:rgba(15,122,91,.5)}
.sum-card.hpk{background:rgba(212,84,122,.25);border-color:rgba(212,84,122,.4)}
.sum-l{font-size:9px;color:rgba(255,255,255,.5);margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em}
.sum-v{font-size:15px;font-weight:600;color:#fff;font-family:var(--fm)}
.sum-v.total{color:#4ade80;font-size:17px}
.sum-v.preco{color:#fbbf24;font-size:17px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:11px}
.bar-lbl{width:140px;color:rgba(255,255,255,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.bar-track{flex:1;height:4px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--g),#4ade80)}
.bar-val{width:110px;text-align:right;color:rgba(255,255,255,.4);font-family:var(--fm);font-size:10px;flex-shrink:0}

/* ── CHIPS ── */
.chip{font-size:9px;border-radius:20px;padding:2px 7px;font-weight:500;letter-spacing:.03em}
.chip-g{background:var(--ok-bg);color:var(--ok)}
.chip-pk{background:var(--pk3);color:var(--pk)}
.chip-gd{background:#fef9e7;color:var(--warn)}
.chip-ink{background:rgba(255,255,255,.1);color:rgba(255,255,255,.6)}

/* ── HIST ── */
.hist-layout{display:flex;gap:1rem}
.hist-sidebar{width:168px;flex-shrink:0}
.hist-metal-btn{display:flex;align-items:center;gap:7px;width:100%;padding:8px 10px;border:none;background:none;font-family:var(--fn);font-size:12px;color:var(--ink3);cursor:pointer;border-bottom:1px solid var(--line2);transition:all .12s;text-align:left}
.hist-metal-btn.active{background:var(--g3);color:var(--g);font-weight:500}
.hist-metal-btn:hover:not(.active){background:var(--line2)}
.hcards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1rem}
.hcard{background:var(--w);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.hcard-l{font-size:9px;color:var(--ink4);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.hcard-v{font-size:16px;font-weight:600;color:var(--ink);font-family:var(--fm)}
.chart-wrap{position:relative;height:170px;margin:.8rem 0}
.htbl th{font-size:9px;font-weight:600;color:var(--ink4);text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.05em}
.htbl td{padding:5px 7px;border-bottom:1px solid var(--line2);vertical-align:middle;font-size:12px}
.htbl tr:last-child td{border-bottom:none}
.htbl input{width:100%;padding:4px 7px;border:1px solid var(--line);border-radius:5px;font-family:var(--fn);font-size:11px;color:var(--ink);outline:none}
.htbl input:focus{border-color:var(--g)}
.apply-btn{font-size:11px;background:var(--g3);color:var(--g);border:1px solid var(--g);border-radius:20px;padding:3px 9px;cursor:pointer;font-weight:500}.apply-btn:hover{background:var(--g);color:#fff}
.var-up{color:var(--err);font-size:10px;font-weight:500}
.var-dn{color:var(--ok);font-size:10px;font-weight:500}
.var-eq{color:var(--ink4);font-size:10px}

/* ── SIMULADOR ── */
.sim-metal-row{display:grid;grid-template-columns:12px 1fr 160px 64px 100px;gap:10px;align-items:center;padding:9px 12px;border-radius:var(--r);margin-bottom:5px;background:var(--w);border:1px solid var(--line)}
.sim-slider{width:100%;accent-color:var(--g)}
.sim-pct{font-size:13px;font-weight:600;font-family:var(--fm);text-align:right}
.sim-pct.pos{color:var(--err)}.sim-pct.neg{color:var(--ok)}.sim-pct.zer{color:var(--ink4)}
.sim-novo{font-size:11px;font-family:var(--fm);font-weight:500;color:var(--ink2);text-align:right}
.sim-tbl{width:100%;border-collapse:collapse;font-size:11px}
.sim-tbl th{font-size:9px;font-weight:600;color:var(--ink4);padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;text-transform:uppercase;letter-spacing:.05em}
.sim-tbl th:first-child{text-align:left}
.sim-tbl td{padding:6px 8px;border-bottom:1px solid var(--line2);text-align:right;vertical-align:middle;font-family:var(--fm)}
.sim-tbl td:first-child{text-align:left;font-family:var(--fn);font-weight:500;color:var(--ink)}
.sim-tbl tr:last-child td{border-bottom:none}
.badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:20px;font-weight:500}
.badge-up{background:var(--err-bg);color:var(--err)}
.badge-dn{background:var(--ok-bg);color:var(--ok)}
.badge-eq{background:var(--line2);color:var(--ink4)}
.sim-chart-wrap{position:relative;height:190px;margin:.8rem 0}
.reset-btn{display:inline-flex;align-items:center;gap:5px;font-size:11px;background:none;border:1px solid var(--line);border-radius:20px;padding:4px 10px;cursor:pointer;color:var(--ink3)}.reset-btn:hover{background:var(--line2)}

/* ── COMPARATIVO ── */
.comp-tbl{width:100%;border-collapse:collapse;font-size:11px}
.comp-tbl th{font-size:9px;font-weight:600;color:var(--ink4);padding:7px 9px;border-bottom:1.5px solid var(--line);text-align:right;text-transform:uppercase;letter-spacing:.05em;background:var(--line2)}
.comp-tbl th:first-child{text-align:left}
.comp-tbl td{padding:7px 9px;border-bottom:1px solid var(--line2);text-align:right;vertical-align:middle;font-family:var(--fm);font-size:11px}
.comp-tbl td:first-child{text-align:left;font-family:var(--fn);font-weight:500;color:var(--ink);font-size:12px}
.comp-tbl tr:hover td{background:var(--g3);cursor:pointer}
.comp-tbl tr:last-child td{border-bottom:none}

/* ── TOAST ── */
.toast-wrap{position:fixed;bottom:1.5rem;right:1.5rem;display:flex;flex-direction:column;gap:8px;z-index:999}
.toast{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;font-size:12px;font-weight:500;box-shadow:var(--sh2);animation:slideUp .25s ease;max-width:300px}
.toast-ok{background:var(--ink);color:#fff;border-left:3px solid #4ade80}
.toast-err{background:#fff;color:var(--err);border:1px solid var(--err);border-left:3px solid var(--err)}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ── ACTIONS ── */
.actions{display:flex;gap:8px;margin-top:1rem;flex-wrap:wrap}

/* ── FORMULA BOX ── */
.formula-box{background:var(--g3);border:1px solid var(--line);border-radius:var(--r);padding:9px 12px;font-size:11px;color:var(--ink2);line-height:1.65;margin-top:.7rem}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="brand">
    <div class="brand-logo">💎</div>
    <div>
      <div class="brand-name">Pink Heart · Veri</div>
      <div class="brand-sub">Sistema CPV</div>
    </div>
  </div>

  <nav class="topbar-nav">
    <button class="tnav active" onclick="goTab('metais',this)"><i class="ti ti-table"></i>Metais</button>
    <button class="tnav" onclick="goTab('historico',this)"><i class="ti ti-chart-line"></i>Histórico</button>
    <button class="tnav" onclick="goTab('simulador',this)"><i class="ti ti-adjustments"></i>Simulador</button>
    <button class="tnav" onclick="goTab('skus',this)"><i class="ti ti-diamond"></i>SKUs / CPV</button>
    <button class="tnav" onclick="goTab('resumo',this)"><i class="ti ti-chart-bar"></i>Comparativo</button>
  </nav>

  <div class="topbar-right">
    <div class="status-dot" id="sdot"></div>
    <span class="status-txt" id="stxt">Conectando…</span>
  </div>
</div>

<!-- MAIN -->
<div class="main">
  <div id="tab-metais"   class="tab-content active"></div>
  <div id="tab-historico" class="tab-content"></div>
  <div id="tab-simulador" class="tab-content"></div>
  <div id="tab-skus"     class="tab-content"></div>
  <div id="tab-resumo"   class="tab-content"></div>
</div>

<div class="toast-wrap" id="toasts"></div>

<script>
/* ═══════════════════ SUPABASE ═══════════════════ */
const SB_URL  = 'https://khzviafgkswyajrdnbyp.supabase.co';
const SB_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtoenZpYWZna3N3eWFqcmRuYnlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0NTU3ODgsImV4cCI6MjA5NDAzMTc4OH0.OJE1NwBZVWmx2oNJU6PjDPWVP-c2SDocTdfLoyaIoaE';
const sb      = supabase.createClient(SB_URL, SB_KEY);

/* ═══════════════════ HELPERS ═══════════════════ */
const R   = v => isNaN(v)||v===null||v===''?0:Number(v);
const fmt = v => 'R$ '+R(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtN= (v,d=2)=>R(v).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtG= v=>R(v).toLocaleString('pt-BR',{minimumFractionDigits:4,maximumFractionDigits:4});
const pct = v=>R(v).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
const today=()=>new Date().toISOString().slice(0,10);

function toast(msg,type='ok'){
  const w=document.getElementById('toasts');
  const d=document.createElement('div');
  d.className=`toast toast-${type}`;
  d.innerHTML=`<i class="ti ti-${type==='ok'?'check':'alert-circle'}"></i>${msg}`;
  w.appendChild(d);
  setTimeout(()=>d.remove(),3200);
}

function setStatus(ok){
  document.getElementById('sdot').className='status-dot '+(ok?'ok':'err');
  document.getElementById('stxt').textContent=ok?'Conectado':'Erro BD';
}

/* ═══════════════════ STATE ═══════════════════ */
let metais   = [];
let historico= {}; // {metalId:[...]}
let skus     = [];
let skuMls   = {}; // {skuId:[...]}
let skuInd   = {}; // {skuId:[...]}
let simVar   = {};
let curTab   = 'metais';
let histMid  = null;
let activeSkuId = null;
let chartH   = null;
let chartSim = null;

/* ═══════════════════ SUPABASE LOAD ═══════════════════ */
async function loadAll(){
  try{
    const [m,h,s,ml,in_] = await Promise.all([
      sb.from('cpv_metais').select('*').eq('ativo',true).order('id'),
      sb.from('cpv_metais_historico').select('*').order('data'),
      sb.from('cpv_skus').select('*').eq('ativo',true).order('id'),
      sb.from('cpv_sku_mls').select('*').order('ordem'),
      sb.from('cpv_sku_indiretos').select('*').order('ordem'),
    ]);
    if(m.error||h.error||s.error||ml.error||in_.error) throw m.error||h.error||s.error||ml.error||in_.error;
    metais = m.data||[];
    historico={};
    (h.data||[]).forEach(e=>{if(!historico[e.metal_id])historico[e.metal_id]=[];historico[e.metal_id].push(e);});
    skus   = s.data||[];
    skuMls ={};
    (ml.data||[]).forEach(l=>{if(!skuMls[l.sku_id])skuMls[l.sku_id]=[];skuMls[l.sku_id].push(l);});
    skuInd ={};
    (in_.data||[]).forEach(i=>{if(!skuInd[i.sku_id])skuInd[i.sku_id]=[];skuInd[i.sku_id].push(i);});
    metais.forEach(m=>{if(simVar[m.id]===undefined)simVar[m.id]=0;});
    if(!histMid&&metais.length)histMid=metais[0].id;
    if(!activeSkuId&&skus.length)activeSkuId=skus[0].id;
    setStatus(true);
    render();
  }catch(e){
    setStatus(false);
    toast('Erro ao carregar dados','err');
    console.error(e);
  }
}

function calcSkuSim(s,precosSim){
  const mls=skuMls[s.id]||[];
  const ind=skuInd[s.id]||[];
  const vol=Math.max(R(s.volume),1);
  const mat=R(s.preco_bruto);
  const proc=R(s.corte)+R(s.solda)+R(s.montagem)+R(s.iq_semiacabado)+R(s.trat_superficie)+R(s.pre_elos);
  let mlsCusto=0;
  mls.forEach(l=>{
    const metal=metais.find(m=>m.id===l.metal_id)||metais[0];
    const pr=precosSim[metal?.id]??metal?.preco_grama??0;
    mlsCusto+=R(l.microns)*1e-4*R(l.area)*R(metal?.densidade)*pr;
  });
  const galv=mlsCusto+R(s.galvano_quebec)+R(s.galvano_ecoat)+R(s.posbanho)+R(s.banho_rodio)+R(s.banho_paladio);
  const acab=(s.aplic_rodio==='S'?R(s.custo_aplic_rodio):0)+(s.resina==='S'?R(s.custo_resina):0)+(s.colagem==='S'?R(s.custo_colagem):0)+R(s.etiquetagem)+R(s.seriais);
  let indT=0;
  ind.forEach(i=>{
    const v=R(i.valor);
    indT+=i.tipo==='fixo_total'?v/vol:i.tipo==='por_unidade'?v:(mat+proc+galv+acab)*(v/100);
  });
  return mat+proc+galv+acab+indT;
}

function calcSku(s){
  const mls=skuMls[s.id]||[];
  const ind=skuInd[s.id]||[];
  const vol=Math.max(R(s.volume),1);
  const mat=R(s.preco_bruto);
  const proc=R(s.corte)+R(s.solda)+R(s.montagem)+R(s.iq_semiacabado)+R(s.trat_superficie)+R(s.pre_elos);
  let mlsTotal=0;
  const mlsDet=mls.map(l=>{
    const metal=metais.find(m=>m.id===l.metal_id)||metais[0]||{preco_grama:0,densidade:10};
    const peso_g=R(l.microns)*1e-4*R(l.area)*R(metal.densidade);
    const custo=peso_g*R(metal.preco_grama);
    mlsTotal+=custo;
    return{...l,metal,peso_g,custo};
  });
  const galv=mlsTotal+R(s.galvano_quebec)+R(s.galvano_ecoat)+R(s.posbanho)+R(s.banho_rodio)+R(s.banho_paladio);
  const acab=(s.aplic_rodio==='S'?R(s.custo_aplic_rodio):0)+(s.resina==='S'?R(s.custo_resina):0)+(s.colagem==='S'?R(s.custo_colagem):0)+R(s.etiquetagem)+R(s.seriais);
  let indT=0;
  const indDet=ind.map(i=>{
    const v=R(i.valor);
    let u=i.tipo==='fixo_total'?v/vol:i.tipo==='por_unidade'?v:(mat+proc+galv+acab)*(v/100);
    indT+=u;return{...i,unitario:u};
  });
  const total=mat+proc+galv+acab+indT;
  const mg=R(s.margem);
  return{mat,proc,galv,acab,ind:indT,total,precoSug:mg<100?total/(1-mg/100):0,mlsTotal,mlsDet,indDet,vol};
}

async function addSku(){
  const {data,error}=await sb.from('cpv_skus').insert({nome:'Novo SKU',volume:100,margem:30}).select().single();
  if(error){toast('Erro ao criar SKU','err');return;}
  await sb.from('cpv_sku_indiretos').insert({sku_id:data.id,descricao:'',valor:0,tipo:'fixo_total',ordem:0});
  toast('SKU criado ✓');
  await loadAll();
  activeSkuId=data.id;
  render();
}

async function saveSku(){
  const s=skus.find(x=>x.id===activeSkuId);
  if(!s)return;
  const {error}=await sb.from('cpv_skus').update({
    nome:s.nome,volume:s.volume,preco_bruto:s.preco_bruto,fundicao:s.fundicao,
    corte:s.corte,solda:s.solda,montagem:s.montagem,iq_semiacabado:s.iq_semiacabado,
    trat_superficie:s.trat_superficie,pre_elos:s.pre_elos,
    galvano_quebec:s.galvano_quebec,galvano_ecoat:s.galvano_ecoat,posbanho:s.posbanho,
    banho_rodio:s.banho_rodio,banho_paladio:s.banho_paladio,
    aplic_rodio:s.aplic_rodio,custo_aplic_rodio:s.custo_aplic_rodio,
    resina:s.resina,custo_resina:s.custo_resina,
    colagem:s.colagem,custo_colagem:s.custo_colagem,
    etiquetagem:s.etiquetagem,seriais:s.seriais,margem:s.margem,
    atualizado_em:new Date().toISOString()
  }).eq('id',s.id);
  if(error)toast('Erro ao salvar','err');
  else toast('SKU salvo ✓');
}

function updSku(field,val){

  const numFields=['volume','preco_bruto','corte','solda','montagem','iq_semiacabado','trat_superficie','pre_elos','galvano_quebec','galvano_ecoat','posbanho','banho_rodio','banho_paladio','custo_aplic_rodio','custo_resina','custo_colagem','etiquetagem','seriais','margem'];

}

/* ═══════════════════ EXPORT / AI ═══════════════════ */
function exportCSV(){
  const h='SKU,Volume/mês,Material,Processos,Galvano/Mls,Acabamentos,Indiretos,CPV Total,Preço Sugerido,Margem%';
  const rows=skus.map(s=>{const c=calcSku(s);return`${s.nome},${c.vol},${c.mat.toFixed(2)},${c.proc.toFixed(2)},${c.galv.toFixed(2)},${c.acab.toFixed(2)},${c.ind.toFixed(2)},${c.total.toFixed(2)},${c.precoSug.toFixed(2)},${s.margem}%`;});
  const blob=new Blob([[h,...rows].join('\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cpv_pink_heart.csv';a.click();
}

function sendToAI(id){
  const s=skus.find(x=>x.id===id);if(!s)return;
  const c=calcSku(s);
  const msg=`Analise o CPV do SKU "${s.nome}" (Pink Heart/Veri): material bruto R$${c.mat.toFixed(2)}, processos R$${c.proc.toFixed(2)}, galvanização/milesimagem R$${c.galv.toFixed(2)}, acabamentos R$${c.acab.toFixed(2)}, custos indiretos rateados R$${c.ind.toFixed(2)} (volume ${c.vol} un/mês), CPV total R$${c.total.toFixed(2)}, preço sugerido R$${c.precoSug.toFixed(2)} com margem de ${s.margem}%. Dê insights sobre a composição de custos e oportunidades de redução.`;
  if(typeof sendPrompt==='function')sendPrompt(msg);
}
